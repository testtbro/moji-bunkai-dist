# Publishes a plugin update:
#   1. creates a GitHub Release v<version> and uploads the ZXP as its asset,
#   2. signs mojibunkai/latest.json (pointing at the release asset URL) by
#      calling the licensing Worker's /admin/release,
#   3. commits latest.json and removes the ZXP from the repo tree (binaries
#      live only as Release assets, not in the working tree).
#
# The signing secret never leaves the Worker; this workflow only sends
# ADMIN_TOKEN (a GitHub Actions secret, never in the repo or in chat).
#
# One-time setup: Settings -> Secrets and variables -> Actions ->
#   New repository secret:  name ADMIN_TOKEN, value = the Worker admin token.
#   (optional) Variables -> WORKER_URL if the Worker URL ever changes.
#
# Prerequisite each release: the built ZXP for <version> is committed at
#   mojibunkai/MojiBunkai-<version>.zxp  (Claude / release.sh pushes it first).
#   This workflow moves it into the Release and deletes it from the tree.
name: Publish update

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Plugin version to release (e.g. 1.3.0)"
        required: true
      notes:
        description: "Release notes (shown on the Release page and in the panel)"
        required: false
        default: ""
      mandatory:
        description: "Mark as a mandatory update"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      NOTES: ${{ inputs.notes }}
    steps:
      - uses: actions/checkout@v4

      - name: Locate the built ZXP
        run: |
          set -euo pipefail
          ZXP="mojibunkai/MojiBunkai-${VERSION}.zxp"
          if [ ! -f "$ZXP" ]; then
            echo "::error::$ZXP not found. Build and commit the ZXP for this version first (release.sh)."
            exit 1
          fi
          echo "ZXP=$ZXP" >> "$GITHUB_ENV"
          echo "TAG=v${VERSION}" >> "$GITHUB_ENV"

      - name: Create / update the GitHub Release and upload the ZXP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZXP" --clobber
          else
            gh release create "$TAG" "$ZXP" --title "$TAG" --notes "${NOTES:-Release $TAG}"
          fi
          echo "Release $TAG ready with asset $(basename "$ZXP")"

      - name: Sign latest.json via the licensing Worker (release asset URL)
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          WORKER_URL: ${{ vars.WORKER_URL || 'https://plugin-licensing.lnidasan.workers.dev' }}
          MANDATORY: ${{ inputs.mandatory }}
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_TOKEN:-}" ]; then
            echo "::error::ADMIN_TOKEN secret is not set. Add it in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(basename "$ZXP")"
          echo "Announcing $VERSION -> $URL"
          body=$(jq -nc --arg p mojibunkai --arg v "$VERSION" --arg u "$URL" --arg n "$NOTES" --argjson m "${MANDATORY:-false}" \
            '{product:$p, version:$v, url:$u, notes:$n, mandatory:$m}')
          resp=$(curl -sS -X POST "${WORKER_URL%/}/admin/release" \
            -H "authorization: Bearer ${ADMIN_TOKEN}" -H 'content-type: application/json' -d "$body")
          if ! echo "$resp" | jq -e '.ok == true' >/dev/null 2>&1; then
            echo "::error::signing failed: $(echo "$resp" | jq -r '.error // "unknown"')"
            exit 1
          fi
          echo "$resp" | jq '{token: .manifest.token}' > mojibunkai/latest.json
          echo "Wrote mojibunkai/latest.json"

      - name: Commit latest.json and drop the in-repo ZXP
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm --quiet --ignore-unmatch "$ZXP"
          git add mojibunkai/latest.json
          if git diff --cached --quiet; then
            echo "nothing to commit."
            exit 0
          fi
          git commit -m "Publish update ${VERSION} (release asset)"
          git push
