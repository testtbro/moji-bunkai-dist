# Signs and commits mojibunkai/latest.json so installed plugins show the
# "new version available" banner. The signing secret never leaves the Worker;
# this workflow only calls the Worker's /admin/release with ADMIN_TOKEN, which
# is stored as a GitHub Actions secret (never in the repo or in chat).
#
# One-time setup: Settings -> Secrets and variables -> Actions ->
#   New repository secret:  name ADMIN_TOKEN, value = the Worker admin token.
#   (optional) Variables -> WORKER_URL if the Worker URL ever changes.
#
# Prerequisite each release: the ZXP for <version> must already be committed at
#   mojibunkai/MojiBunkai-<version>.zxp  (Claude pushes it before running this).
name: Publish update

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Plugin version to announce (e.g. 1.3.0)"
        required: true
      notes:
        description: "Release notes shown in the panel"
        required: false
        default: ""
      mandatory:
        description: "Mark as a mandatory update"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sign latest.json via the licensing Worker
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          WORKER_URL: ${{ vars.WORKER_URL || 'https://plugin-licensing.lnidasan.workers.dev' }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
          MANDATORY: ${{ inputs.mandatory }}
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_TOKEN:-}" ]; then
            echo "::error::ADMIN_TOKEN secret is not set. Add it in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          ZXP="mojibunkai/MojiBunkai-${VERSION}.zxp"
          if [ ! -f "$ZXP" ]; then
            echo "::error::$ZXP not found. Commit the built ZXP for this version first."
            exit 1
          fi
          URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/${ZXP}"
          echo "Announcing $VERSION -> $URL"
          body=$(jq -nc --arg p mojibunkai --arg v "$VERSION" --arg u "$URL" --arg n "$NOTES" --argjson m "${MANDATORY:-false}" \
            '{product:$p, version:$v, url:$u, notes:$n, mandatory:$m}')
          resp=$(curl -sS -X POST "${WORKER_URL%/}/admin/release" \
            -H "authorization: Bearer ${ADMIN_TOKEN}" -H 'content-type: application/json' -d "$body")
          if ! echo "$resp" | jq -e '.ok == true' >/dev/null 2>&1; then
            echo "::error::signing failed: $(echo "$resp" | jq -r '.error // "unknown"')"
            exit 1
          fi
          echo "$resp" | jq '{token: .manifest.token}' > mojibunkai/latest.json
          echo "Wrote mojibunkai/latest.json"

      - name: Commit latest.json
        run: |
          set -euo pipefail
          if git diff --quiet -- mojibunkai/latest.json; then
            echo "latest.json unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mojibunkai/latest.json
          git commit -m "Publish update ${{ inputs.version }}"
          git push
